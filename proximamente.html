<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Módulo próximamente | JC Motors</title>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Century Gothic', Arial, Helvetica, sans-serif;
      background: repeating-linear-gradient(135deg, #191919 0%, #232323 100%);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2.2rem 2rem 1.1rem 2rem;
    }
    .logo {
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 0.2rem;
    }
    .logo .jc { color: #eb3223; }
    .logo .motors { color: #fff; margin-left: 0.2rem;}
    .logout {
      color: #fff;
      text-decoration: none;
      font-size: 1.09rem;
      font-family: 'Montserrat', 'Century Gothic', Arial, Helvetica, sans-serif;
      font-weight: 400;
    }
    .main-content {
      flex: 1 1 0%;
      max-width: 480px;
      margin: 0 auto;
      padding: 2.5rem 1.2rem 0 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .proximamente-box {
      background: #151515d9;
      border: 2px solid #eb3223;
      border-radius: 16px;
      box-shadow: 0 4px 32px #0007;
      padding: 2.3rem 1.7rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 3.5rem;
    }
    .proximamente-title {
      font-size: 1.21rem;
      font-weight: 700;
      color: #eb3223;
      margin-bottom: 0.7rem;
      letter-spacing: 0.03em;
      text-align: center;
    }
    .proximamente-text {
      font-size: 1.08rem;
      color: #fff;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .soon-icon {
      font-size: 2.5rem;
      margin-bottom: 0.7rem;
      color: #eb3223;
      animation: pulse 1.7s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.7;}
      50% { opacity: 1;}
      100% { opacity: 0.7;}
    }
    @media (max-width: 600px) {
      .header {
        padding: 1.3rem 0.7rem 0.8rem 0.7rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.7rem;
      }
      .main-content {
        padding: 1.5rem 0.4rem 0 0.4rem;
      }
      .proximamente-box {
        padding: 1.4rem 0.7rem;
        margin-top: 2.3rem;
      }
      .proximamente-title {
        font-size: 1.09rem;
      }
      .proximamente-text {
        font-size: 0.98rem;
      }
    }
    @media (max-width: 400px) {
      .proximamente-box {
        padding: 1rem 0.2rem;
      }
      .logo {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span class="jc">JC</span>
      <span class="motors">MOTORS</span>
    </div>
    <a href="modulos-imagenes.html" class="logout">Regresar</a>
  </div>
  <div class="main-content">
    <div class="proximamente-box">
      <div class="soon-icon">⏳</div>
      <div class="proximamente-title">Módulo próximamente</div>
      <div class="proximamente-text">
        Los módulos <strong>Validación de crédito</strong> y <strong>Tips esenciales de seguridad</strong> estarán disponibles próximamente.<br>
        ¡Vuelve pronto para acceder a este contenido!
      </div>
    </div>
  </div>
</body>
</html>
