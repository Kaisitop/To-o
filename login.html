<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700&display=swap" rel="stylesheet">
  <title>Login - JC Motors</title>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>
  <div class="login-container">
    <div class="login-avatar">
      <svg width="50" height="50" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="24" fill="none" stroke="#eb3223" stroke-width="3"/>
        <circle cx="25" cy="20" r="8" fill="none" stroke="#eb3223" stroke-width="3"/>
        <path d="M15 37c0-5.5 20-5.5 20 0" fill="none" stroke="#eb3223" stroke-width="3"/>
      </svg>
    </div>
    <form class="login-box">
      <label for="usuario">USUARIO</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" />
      <label for="password">CONTRASEÑA</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <button type="submit" class="login-btn">INICIAR SESIÓN</button>
    </form>
    <div class="login-brand">
      <span class="jc">JC</span>
      <span class="motors">MOTORS</span>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
